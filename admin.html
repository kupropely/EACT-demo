<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENACT 연구 관리자</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f1f4f3;color:#173e4d;margin:0}main{max-width:1050px;margin:30px auto;padding:0 18px}h1{font-size:25px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #143c4d12}input,button{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #bbcfc8;max-width:300px}button{background:#1e4353;color:white;border:0;cursor:pointer;margin:5px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}th,td{padding:10px;border-bottom:1px solid #dce8e4;text-align:left}th{background:#eaf2ef}.scroll{overflow-x:auto}.muted{color:#607c83;font-size:13px}.stat{display:inline-block;background:#eaf2ef;border-radius:10px;padding:14px;margin:6px;font-weight:bold}#dashboard{display:none}</style></head><body><main><h1>ENACT 연구 관리자 페이지</h1><p class="muted">휴대전화 번호를 수집하지 않습니다. 참여코드와 기능별 완료 이벤트만 표시합니다.</p><section class="card" id="login"><h2>관리자 로그인</h2><input type="password" id="password" placeholder="관리자 비밀번호"><button onclick="login()">로그인</button><p id="loginError" class="muted"></p></section><section id="dashboard"><div class="card"><button onclick="load()">새로고침</button><button onclick="downloadCsv()">CSV 다운로드</button><button onclick="logout()">로그아웃</button><div id="stats"></div></div><div class="card scroll"><table><thead><tr><th>참여코드</th><th>첫 접속</th><th>최근 접속</th><th>통증</th><th>걷기</th><th>마음챙김</th><th>교육</th><th>NERO</th><th>진행률</th></tr></thead><tbody id="records"></tbody></table></div><p class="muted">완료는 앱에서 발생한 이벤트의 서버 기록이며 실제 집중 시청이나 본인 여부를 독립적으로 검증하는 것은 아닙니다. Google 설문 제출 여부는 별도 대조가 필요합니다.</p></section></main><script>let data=[];const feats=['pain','walk','mind','learn','chat'];function fmt(s){return s?new Date(s).toLocaleString('ko-KR'):'—'}function cell(s){const e=document.createElement('td');e.textContent=s;return e}async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok){document.getElementById('loginError').textContent='로그인에 실패했습니다.';return}document.getElementById('password').value='';load()}async function load(){const r=await fetch('/api/admin/records');if(r.status===401){document.getElementById('login').style.display='block';document.getElementById('dashboard').style.display='none';return}if(!r.ok){alert('자료를 불러오지 못했습니다.');return}data=(await r.json()).records;document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';const all=data.filter(p=>feats.every(f=>p.completed[f])).length;document.getElementById('stats').textContent='발급 '+data.length+'명 · 5개 완료 '+all+'명 · 진행 중 '+(data.length-all)+'명';const tbody=document.getElementById('records');tbody.replaceChildren();for(const p of data){const tr=document.createElement('tr');[p.code,fmt(p.created_at),fmt(p.last_seen),...feats.map(f=>p.completed[f]?'✓':'—'),feats.filter(f=>p.completed[f]).length+'/5'].forEach(x=>tr.appendChild(cell(x)));tbody.appendChild(tr)}}function downloadCsv(){const rows=[['참여코드','최초접속','최근접속',...feats,'완료수','전체완료'],...data.map(p=>[p.code,p.created_at,p.last_seen,...feats.map(f=>p.completed[f]||''),feats.filter(f=>p.completed[f]).length,feats.every(f=>p.completed[f])?'Y':'N'])];const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ENACT_체험기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function logout(){await fetch('/api/admin/logout',{method:'POST'});load()}load();</script></body></html>
